
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control de ingreso - ZDC</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f5f2;
      text-align: center;
      padding: 20px;
      margin: 0;
    }

    .panel {
      background: white;
      max-width: 500px;
      margin: 20px auto;
      padding: 25px 20px;
      border-radius: 18px;
      box-shadow: 0 3px 12px #00000015;
    }

    h2 { color: #245b3d; }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      font-size: 18px;
      margin: 15px 0;
    }

    button {
      width: 100%;
      padding: 17px;
      background: #245b3d;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    #lector {
      width: 100%;
      margin: 15px auto;
    }

    #resultado {
      margin-top: 18px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="panel">
    <h2>Zona de Diversión Campestre</h2>
    <h3>Validación de ingreso</h3>

    <div id="acceso">
      <p>Ingresa tu PIN de encargado.</p>
      <input type="password" id="pin" placeholder="PIN de autorización">
      <button onclick="ingresar()">INGRESAR</button>
    </div>

    <div id="validacion" style="display:none">
      <p id="encargado"></p>
      <button id="btnEncender" onclick="iniciarEscaner()">
        ACTIVAR CÁMARA
      </button>
      <div id="lector"></div>
    </div>

    <div id="resultado">Esperando autorización...</div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxCLv1X12rByidlIrA-YQejH24gXkBiwfXl0rfvTRvrwBXIk0bi4sGtKdepxebsYXsfxw/exec";
    let lectorQR = null;
    let procesando = false;
function llamarApi(parametros, callback) {
  const nombre = "respuestaApi_" + Date.now();

  const script = document.createElement("script");

  window[nombre] = function(respuesta) {
    delete window[nombre];
    script.remove();
    callback(respuesta);
  };

  parametros.api = "1";
  parametros.callback = nombre;

  const consulta = new URLSearchParams(parametros);

  script.src = API_URL + "?" + consulta.toString();

  script.onerror = function() {
    delete window[nombre];
    script.remove();

    callback({
      ok: false,
      mensaje: "No se pudo conectar con el servidor."
    });
  };

  document.body.appendChild(script);
}
    function ingresar() {
  const pin = document.getElementById("pin").value.trim();
  const resultado = document.getElementById("resultado");

  if (!pin) {
    resultado.textContent = "Ingresa tu PIN.";
    return;
  }

  resultado.textContent = "Verificando autorización...";

  llamarApi(
    {
      accion: "autenticar",
      pin: pin
    },
    function(respuesta) {
      if (!respuesta.ok) {
        resultado.textContent = respuesta.mensaje;
        return;
      }

      window.tokenEncargado = respuesta.token;

      document.getElementById("acceso").style.display = "none";
      document.getElementById("validacion").style.display = "block";
      document.getElementById("encargado").textContent =
        "Encargado: " + respuesta.nombre;

      resultado.textContent =
        "Autorización correcta. Pulsa ACTIVAR CÁMARA.";
    }
  );
}
  </script>
</body>
</html>
